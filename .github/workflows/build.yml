name: Vaultify Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vaultify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK & Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract App Version
        id: app_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Validate TypeScript Types
        run: npx vue-tsc --noEmit

      - name: Build Web Assets (Production)
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Verify Android Assets Synced
        run: |
          echo "=== DIST ASSETS ==="
          ls -la dist/assets
          echo "=== ANDROID COPIED ASSETS ==="
          ls -la android/app/src/main/assets/public/assets

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Prepare Debug APK Artifact
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/Vaultify-v${{ steps.app_version.outputs.version }}-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Vaultify-Android-Debug
          path: dist-apk/Vaultify-v${{ steps.app_version.outputs.version }}-debug.apk
          retention-days: 14

      # ==========================================
      # RELEASE BUILD (Version Tags Only: v*)
      # ==========================================
      - name: Setup Keystore for Release Signing
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          echo "ANDROID_KEYSTORE_PATH=release.keystore" >> $GITHUB_ENV

      - name: Build Release APK and AAB
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Prepare Release Artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p dist-release
          # Copy Release APK (signed or unsigned fallback)
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk dist-release/Vaultify-v${{ steps.app_version.outputs.version }}.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist-release/Vaultify-v${{ steps.app_version.outputs.version }}.apk
          fi

          # Copy Release AAB Bundle (signed or unsigned fallback)
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab dist-release/Vaultify-v${{ steps.app_version.outputs.version }}.aab
          elif [ -f android/app/build/outputs/bundle/release/app-release-unsigned.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release-unsigned.aab dist-release/Vaultify-v${{ steps.app_version.outputs.version }}.aab
          fi

      - name: Upload Release Artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Vaultify-Android-Release
          path: dist-release/*
          retention-days: 14

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract App Version
        id: app_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Vaultify-Android-Release
          path: release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Vaultify v${{ steps.app_version.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: release-artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
